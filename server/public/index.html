<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Office Sir Calling System</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1a1a2e;border:1px solid #2d3748;border-radius:20px;padding:40px 36px;width:440px;box-shadow:0 4px 40px rgba(0,0,0,0.5)}
h1{font-size:1.4rem;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#64748b;font-size:0.85rem;margin-bottom:28px}
.logo{font-size:3rem;text-align:center;display:block;margin-bottom:12px}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:0}
.role-card{background:#16213e;border:2px solid #2d3748;border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s}
.role-card:hover{border-color:#4f46e5;background:#1e2d4a;transform:translateY(-2px)}
.role-icon{font-size:2.5rem;margin-bottom:10px}
.role-title{font-size:1.1rem;font-weight:700}
.role-desc{font-size:0.8rem;color:#64748b;margin-top:4px}
.hidden{display:none!important}
.form-sec{margin-top:0}
.form-sec h2{text-align:center;margin-bottom:20px;font-size:1.1rem}
label{font-size:0.8rem;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
input[type=password]{width:100%;padding:12px 16px;background:#0f0f1a;border:1.5px solid #2d3748;border-radius:8px;color:#f1f5f9;font-size:1rem;outline:none;margin-bottom:16px}
input[type=password]:focus{border-color:#4f46e5}
.btn-primary{width:100%;padding:13px;background:#4f46e5;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s}
.btn-primary:hover{background:#4338ca}
.btn-back{width:100%;margin-top:10px;padding:10px;background:transparent;color:#94a3b8;border:1px solid #2d3748;border-radius:12px;font-size:.9rem;cursor:pointer}
.btn-back:hover{background:#16213e;color:#f1f5f9}
.emp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;max-height:300px;overflow-y:auto}
.emp-btn{background:#16213e;border:2px solid #2d3748;border-radius:8px;padding:18px 12px;text-align:center;cursor:pointer;color:#f1f5f9;font-size:.95rem;font-weight:600;transition:.2s;font-family:inherit}
.emp-btn:hover{border-color:#4f46e5;transform:translateY(-1px)}
.emp-icon{font-size:1.5rem;display:block;margin-bottom:6px}
.msg{padding:10px 16px;border-radius:8px;font-size:.88rem;font-weight:500;text-align:center;margin-top:12px}
.msg.info{background:rgba(79,70,229,.15);color:#818cf8;border:1px solid rgba(79,70,229,.3)}
.msg.success{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
.msg.error{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
</style>
</head>
<body>
<div class="card" id="app">
  <span class="logo">🏢</span>
  <h1>Office Sir Calling System</h1>
  <p class="sub">Internal Communication System</p>

  <!-- Role Selection -->
  <div id="roleSection">
    <p style="text-align:center;color:#94a3b8;margin-bottom:16px;font-size:.9rem">Select Your Role</p>
    <div class="role-cards">
      <div class="role-card" onclick="selectRole('sir')">
        <div class="role-icon">👔</div>
        <div class="role-title">Sir</div>
        <div class="role-desc">Office Manager</div>
      </div>
      <div class="role-card" onclick="selectRole('employee')">
        <div class="role-icon">👤</div>
        <div class="role-title">Employee</div>
        <div class="role-desc">Staff Member</div>
      </div>
    </div>
  </div>

  <!-- Sir Login -->
  <div id="sirSection" class="form-sec hidden">
    <h2>🔐 Login as Sir</h2>
    <div style="margin-top:16px">
      <label>Password</label>
      <input type="password" id="sirPass" placeholder="Enter password" onkeydown="if(event.key==='Enter')sirLogin()"/>
      <button class="btn-primary" onclick="sirLogin()">Login →</button>
      <button class="btn-back" onclick="back()">← Back</button>
    </div>
  </div>

  <!-- Employee Selection -->
  <div id="empSection" class="form-sec hidden">
    <h2>👤 Select Your Name</h2>
    <div id="empGrid" class="emp-grid" style="margin-top:16px">
      <div style="grid-column:1/-1;text-align:center;color:#64748b">Loading...</div>
    </div>
    <button class="btn-back" onclick="back()">← Back</button>
  </div>

  <div id="msg" class="msg hidden"></div>
</div>

<script>
const socket = io();
let role = null;

function selectRole(r) {
  role = r;
  document.getElementById('roleSection').classList.add('hidden');
  document.getElementById('msg').classList.add('hidden');
  if (r === 'sir') {
    document.getElementById('sirSection').classList.remove('hidden');
    setTimeout(() => document.getElementById('sirPass').focus(), 100);
  } else {
    document.getElementById('empSection').classList.remove('hidden');
    loadEmps();
  }
}

function back() {
  document.getElementById('sirSection').classList.add('hidden');
  document.getElementById('empSection').classList.add('hidden');
  document.getElementById('roleSection').classList.remove('hidden');
  document.getElementById('msg').classList.add('hidden');
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.classList.remove('hidden');
}

function sirLogin() {
  const pass = document.getElementById('sirPass').value.trim();
  if (!pass) { showMsg('Enter your password.', 'error'); return; }
  showMsg('Connecting...', 'info');
  socket.emit('sir_login', { password: pass }, (res) => {
    if (res.success) {
      sessionStorage.setItem('token', res.token);
      sessionStorage.setItem('role', 'sir');
      window.location.href = '/sir.html';
    } else {
      showMsg(res.error || 'Login failed.', 'error');
    }
  });
}

async function loadEmps() {
  const res = await fetch('/employees');
  const emps = await res.json();
  const grid = document.getElementById('empGrid');
  grid.innerHTML = '';
  emps.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'emp-btn';
    btn.innerHTML = `<span class="emp-icon">👤</span>${e.name}`;
    btn.onclick = () => empLogin(e.id, e.name);
    grid.appendChild(btn);
  });
}

function empLogin(id, name) {
  showMsg(`Connecting as ${name}...`, 'info');
  socket.emit('employee_login', { employeeId: id, employeeName: name }, (res) => {
    if (res.success) {
      sessionStorage.setItem('token', res.token);
      sessionStorage.setItem('role', 'employee');
      sessionStorage.setItem('empName', name);
      sessionStorage.setItem('empId', id);
      window.location.href = '/employee.html';
    } else {
      showMsg(res.error || 'Login failed.', 'error');
    }
  });
}
</script>
</body>
</html>
