<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sir Dashboard — Office Sir Calling System</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#f1f5f9;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.conn-bar{display:flex;align-items:center;gap:8px;padding:6px 20px;background:#16213e;border-bottom:1px solid #2d3748;font-size:.8rem}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.green{background:#22c55e;box-shadow:0 0 6px #22c55e;animation:pulse 2s infinite}
.dot.red{background:#ef4444}
.dot.yellow{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.header{padding:16px 24px;background:#1a1a2e;border-bottom:1px solid #2d3748;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.25rem}
.header p{font-size:.78rem;color:#64748b;margin-top:2px}
.online-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:99px;background:rgba(34,197,94,.12);color:#22c55e;font-size:.82rem;font-weight:600;border:1px solid rgba(34,197,94,.3)}
.body{display:flex;flex:1;overflow:hidden}
.main{flex:1;padding:24px;overflow-y:auto}
.section-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:16px}
#onlineCount{color:#22c55e;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.emp-card{background:#1a1a2e;border:1.5px solid #2d3748;border-radius:12px;padding:20px 16px;text-align:center;transition:all .2s;position:relative}
.emp-card.online{cursor:pointer;border-color:rgba(34,197,94,.3)}
.emp-card.online:hover{border-color:#22c55e;background:#1e2d4a;transform:translateY(-3px);box-shadow:0 8px 24px rgba(34,197,94,.15)}
.emp-card.offline{opacity:.5;cursor:default}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin:0 auto 12px;background:#16213e;border:2px solid #2d3748;font-weight:700}
.emp-card.online .avatar{border-color:#22c55e}
.emp-name{font-size:.95rem;font-weight:700;margin-bottom:6px}
.emp-status{font-size:.75rem;font-weight:600}
.emp-card.online .emp-status{color:#22c55e}
.emp-card.offline .emp-status{color:#64748b}
.call-btn{display:none;margin-top:10px;padding:7px 14px;background:#22c55e;color:#fff;border:none;border-radius:6px;font-size:.8rem;font-weight:700;cursor:pointer;width:100%}
.emp-card.online:hover .call-btn{display:block}
.sidebar{width:270px;background:#1a1a2e;border-left:1px solid #2d3748;display:flex;flex-direction:column}
.sidebar-hdr{padding:14px 16px;border-bottom:1px solid #2d3748;font-size:.9rem;font-weight:600}
.log{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.log-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#64748b;font-size:.85rem;flex-direction:column;gap:8px}
.log-item{background:#16213e;border:1px solid #2d3748;border-radius:8px;padding:10px 12px;animation:fadeIn .3s ease}
.log-time{font-size:.72rem;color:#64748b;margin-bottom:4px}
.log-text{font-size:.82rem}
.log-ack{font-size:.75rem;margin-top:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:fadeIn .3s ease;z-index:999;max-width:360px}
.toast.success{background:#052e16;color:#22c55e;border:1px solid rgba(34,197,94,.3)}
.toast.error{background:#2d0a0a;color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.toast.info{background:#1e1b4b;color:#818cf8;border:1px solid rgba(99,102,241,.3)}
.calling-overlay{position:absolute;inset:0;background:rgba(34,197,94,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:#22c55e;animation:pulse 1s infinite}
</style>
</head>
<body>
<!-- Connection bar -->
<div class="conn-bar">
  <div class="dot green" id="connDot"></div>
  <span id="connText">Connected</span>
  <span style="margin-left:auto;color:#475569;font-size:.75rem">localhost:3000</span>
</div>

<!-- Header -->
<header class="header">
  <div>
    <h1>🏢 Office Employee Calling</h1>
    <p>Click an online employee to call them</p>
  </div>
  <div class="online-badge"><div class="dot green"></div>Sir — Online</div>
</header>

<!-- Body -->
<div class="body">
  <main class="main">
    <div class="section-label">Employees <span id="onlineCount">● 0 online</span></div>
    <div class="grid" id="grid">
      <div style="color:#64748b;font-size:.9rem;grid-column:1/-1;padding:20px 0">Waiting for employee status...</div>
    </div>
  </main>
  <aside class="sidebar">
    <div class="sidebar-hdr">📋 Call History</div>
    <div class="log" id="log">
      <div class="log-empty"><span>📭</span><span>No calls yet</span></div>
    </div>
  </aside>
</div>

<!-- Toast -->
<div id="toast" style="display:none" class="toast"></div>

<script>
// Restore session
const token = sessionStorage.getItem('token');
const role  = sessionStorage.getItem('role');
if (!token || role !== 'sir') { window.location.href = '/'; }

const socket = io();
let empStatus = [];
let activeCalls = {};
let toastTimer;

// Re-authenticate with existing token
socket.on('connect', () => {
  // Tell server we're back (Sir re-auth)
  socket.emit('sir_reconnect', { token }, (res) => {
    if (res && !res.success) { window.location.href = '/'; }
  });
  setConn('green', 'Connected');
});

socket.on('employees_status', render);
socket.on('call_acknowledged', (data) => {
  showToast(`✅ ${data.employeeName} received the notification!`, 'success', 5000);
  const entry = activeCalls[data.callId];
  if (entry) {
    const ack = document.querySelector(`[data-call="${data.callId}"] .log-ack`);
    if (ack) { ack.textContent = '✅ Received'; ack.style.color = '#22c55e'; }
  }
});
socket.on('disconnect', () => setConn('red', 'Disconnected — reconnecting...'));
socket.on('reconnect',  () => setConn('green', 'Connected'));

function setConn(color, text) {
  document.getElementById('connDot').className = 'dot ' + color;
  document.getElementById('connText').textContent = text;
}

function render(data) {
  empStatus = data;
  const grid = document.getElementById('grid');
  const online = data.filter(e => e.online).length;
  document.getElementById('onlineCount').textContent = `● ${online} online`;
  grid.innerHTML = '';
  data.forEach(emp => {
    const card = document.createElement('div');
    card.className = 'emp-card ' + (emp.online ? 'online' : 'offline');
    card.id = 'card-' + emp.id;
    card.innerHTML = `
      <div class="avatar">${emp.name.charAt(0)}</div>
      <div class="emp-name">${emp.name}</div>
      <div class="emp-status">${emp.online ? '🟢 Online' : '🔴 Offline'}</div>
      ${emp.online ? `<button class="call-btn" onclick="callEmp('${emp.id}','${emp.name}',event)">📞 Call</button>` : ''}
    `;
    if (emp.online) card.onclick = (e) => { if (!e.target.classList.contains('call-btn')) callEmp(emp.id, emp.name, e); };
    grid.appendChild(card);
  });
}

function callEmp(id, name, e) {
  if (e) e.stopPropagation();
  const card = document.getElementById('card-' + id);
  if (card && card.querySelector('.calling-overlay')) return;
  const overlay = document.createElement('div');
  overlay.className = 'calling-overlay';
  overlay.textContent = '📞 Calling...';
  if (card) card.appendChild(overlay);
  showToast(`📞 Calling ${name}...`, 'info', 3000);
  socket.emit('call_employee', { token, employeeId: id, employeeName: name }, (res) => {
    setTimeout(() => overlay.remove(), 3000);
    if (res.success) {
      addLog(name, res.callId);
      activeCalls[res.callId] = { name };
    } else {
      showToast(`❌ ${res.error}`, 'error', 4000);
    }
  });
}

function addLog(name, callId) {
  const log = document.getElementById('log');
  log.querySelector('.log-empty')?.remove();
  const t = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'});
  const item = document.createElement('div');
  item.className = 'log-item';
  item.dataset.call = callId;
  item.innerHTML = `<div class="log-time">${t}</div><div class="log-text">📞 Called <b>${name}</b></div><div class="log-ack" style="color:#94a3b8">⏳ Waiting...</div>`;
  log.insertBefore(item, log.firstChild);
}

function showToast(msg, type, ms) {
  clearTimeout(toastTimer);
  const t = document.getElementById('toast');
  t.className = 'toast ' + type;
  t.textContent = msg;
  t.style.display = 'flex';
  if (ms) toastTimer = setTimeout(() => t.style.display = 'none', ms);
}
</script>
</body>
</html>
